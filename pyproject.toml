[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "idea-teardown"
version = "0.1.0"
description = "Bounded, evidence-grounded adversarial review through LiteLLM"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Praz" }]
keywords = ["research", "proposal-review", "adversarial-review", "litellm", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
sdk = ["litellm>=1.60,<2"]

[project.scripts]
teardown = "teardown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["teardown"]
